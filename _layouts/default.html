<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {%- if page.title == site.title -%}
            {{ site.title | escape }}
        {%- elsif page.collection == 'posts' -%}
            {{ page.slug | escape }}|{{ site.title | escape }}
        {%- else -%}
            {{ page.title | escape }}|{{ site.title | escape }}
        {%- endif -%}
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Star-Delta/Markdown-CSS@0.6/Markdown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Star-Delta/Markdown-CSS@0.6/Markdown_Print.css"
        media="print">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/markdown-alerts.js' | relative_url }}" defer></script>
</head>

<body class="markdown-colorpallet">
    <header class="site-header">
        <a href="https://star-delta.github.io">
            <img src="{{ '/Banner.png' | relative_url }}" alt="Star-Deltaのホームページ" width="468" height="60">
        </a>
    </header>
    
    <hr>
    
    <div class="container">
        <main class="markdown-body">
            {{ content }}
        </main>

        <nav class="navigation-menu">
            <p>サイトコンテンツ</p>
            <hr>
            <ul>
                <li><a href="{{ '/' | relative_url }}">ホーム</a></li>
                <li><a href="{{ '/Notice/Notice' | relative_url }}">お知らせ</a></li>
                <li><a href="{{ '/Blog/Blog' | relative_url }}">ブログ</a></li>
                <li><a href="{{ '/About' | relative_url }}">このサイトについて</a></li>
            </ul>
        </nav>
    </div>

    <hr>
    
    <footer class="site-footer">
        <small>
            &copy; {{ site.time | date: "%Y" }} Star-Delta
            ·
            <a href="https://github.com/Star-Delta">GitHub</a>
            ·
            <a href="https://creativecommons.org/licenses/by-nd/4.0/deed.ja" rel="license">CC BY-ND 4.0</a>
        </small>
    </footer>

    <!-- Mermaid描画処理 -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'default'
        });

        const diagrams = [];

        document.querySelectorAll('.markdown-body pre > code.language-mermaid')
            .forEach((code) => {
                const diagram = document.createElement('div');
                diagram.className = 'mermaid';
                diagram.textContent = code.textContent;
                code.parentElement.replaceWith(diagram);
                diagrams.push(diagram);
            });

        if (diagrams.length > 0) {
            await mermaid.run({ nodes: diagrams });
        }
    </script>
</body>

</html>
