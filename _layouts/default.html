<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Star-Delta/Markdown-CSS@0/Markdown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Star-Delta/Markdown-CSS@0/Markdown_Print.css"
        media="print">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body class="markdown-colorpallet">
    <header class="site-header">
        <img src="{{ '/Banner.png' | relative_url }}" alt="Star-Deltaのホームページ" width="468" height="60">
    </header>

    <main class="markdown-body">
        {{ content }}
    </main>

    <footer class="site-footer">
        <small>
            &copy; {{ site.time | date: "%Y" }} Star-Delta
            ·
            <a href="https://github.com/Star-Delta">GitHub</a>
            ·
            <a href="https://creativecommons.org/licenses/by-nd/4.0/deed.ja" rel="license">CC BY-ND 4.0</a>
        </small>
    </footer>
</body>

</html>
